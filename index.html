<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundraising Monitor Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            border-right: 2px solid #334155;
        }

        .right-panel {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            background-color: #1e293b;
            padding: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
            text-align: center;
        }

        .thermometer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 55vh;
            width: 100px;
            position: relative;
            margin-top: 20px;
        }

        .tube {
            width: 50px;
            height: 100%;
            background-color: #334155;
            border-radius: 25px 25px 0 0;
            position: relative;
            overflow: hidden;
            border: 4px solid #475569;
            border-bottom: none;
        }

        .fill {
            width: 100%;
            height: 0%;
            background: linear-gradient(0deg, #ef4444, #f97316, #eab308);
            position: absolute;
            bottom: 0;
            transition: height 1s ease-in-out;
            border-radius: 20px 20px 0 0;
        }

        .bulb {
            width: 90px;
            height: 90px;
            background-color: #ef4444;
            border-radius: 50%;
            margin-top: -15px;
            border: 4px solid #475569;
            z-index: 2;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .stats {
            margin-top: 20px;
            text-align: center;
        }

        .stat-box {
            margin: 5px 0;
        }

        .stat-label {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 2.4rem;
            font-weight: bold;
        }

        .raised { color: #4ade80; }
        .target { color: #f87171; }

        .donor-header {
            font-size: 1.8rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            color: #f1f5f9;
        }

        .ticker-wrapper {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
        }

        .ticker-list {
            list-style: none;
            position: absolute;
            width: 100%;
            animation: scroll 15s linear infinite;
        }

        .ticker-item {
            background-color: #0f172a;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #38bdf8;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .donor-name { font-size: 1.2rem; font-weight: 600; }
        .donor-amount { font-size: 1.2rem; color: #4ade80; font-weight: bold; }

        @keyframes scroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 8px;
        }

        .controls input, .controls button {
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        .controls button {
            background-color: #38bdf8;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <h1>Annual Campaign</h1>
        <div class="thermometer-container">
            <div class="tube">
                <div class="fill" id="thermo-fill"></div>
            </div>
            <div class="bulb"></div>
        </div>
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Raised So Far</div>
                <div class="stat-value raised" id="raised-display">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Goal</div>
                <div class="stat-value target" id="target-display">$10,000</div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="donor-header">Recent Supporters</div>
        <div class="ticker-wrapper">
            <ul class="ticker-list" id="donor-list"></ul>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="input-name" placeholder="Donor Name">
        <input type="number" id="input-amount" placeholder="Amount ($)">
        <button onclick="addDonorFromInput()">Add Donation</button>
    </div>

    <script>
        const targetAmount = 10000;
        let raisedAmount = 0;

        let donors = [
            { name: "Alice Smith", amount: 250 },
            { name: "Bob Jones", amount: 100 },
            { name: "Charlie Brown", amount: 500 },
            { name: "Diana Prince", amount: 50 },
            { name: "Evan Wright", amount: 1000 },
            { name: "Fiona Gallagher", amount: 75 }
        ];

        function formatCurrency(num) {
            return '$' + num.toLocaleString();
        }

        document.getElementById('target-display').innerText = formatCurrency(targetAmount);

        function updateThermometer() {
            document.getElementById('raised-display').innerText = formatCurrency(raisedAmount);
            let percentage = (raisedAmount / targetAmount) * 100;
            if (percentage > 100) percentage = 100;
            document.getElementById('thermo-fill').style.height = percentage + '%';
        }

        function renderDonorList() {
            const listElement = document.getElementById('donor-list');
            listElement.innerHTML = '';
            const displayDonors = [...donors, ...donors];

            displayDonors.forEach(donor => {
                const li = document.createElement('li');
                li.className = 'ticker-item';
                li.innerHTML = `
                    <span class="donor-name">${donor.name}</span>
                    <span class="donor-amount">+${formatCurrency(donor.amount)}</span>
                `;
                listElement.appendChild(li);
            });
        }

        function registerNewDonation(name, amount) {
            if (!name || amount <= 0) return;
            donors.unshift({ name: name, amount: amount });
            raisedAmount += amount;
            updateThermometer();
            renderDonorList();
        }

        function init() {
            raisedAmount = donors.reduce((sum, donor) => sum + donor.amount, 0);
            updateThermometer();
            renderDonorList();
        }

        function addDonorFromInput() {
            const nameInput = document.getElementById('input-name');
            const amountInput = document.getElementById('input-amount');
            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (name && !isNaN(amount)) {
                registerNewDonation(name, amount);
                nameInput.value = '';
                amountInput.value = '';
            }
        }

        setInterval(() => {
            const sampleNames = ["Grace Hopper", "Hank Voight", "Ivy Chen", "Jack Reacher", "Karen Page"];
            const randomName = sampleNames[Math.floor(Math.random() * sampleNames.length)];
            const randomAmount = Math.floor(Math.random() * 200) + 25;
            registerNewDonation(randomName, randomAmount);
        }, 8000);

        init();
    </script>
</body>
</html>
